<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมต่อจิ๊กซอว์</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        h2 {
            color: white;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .puzzle-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }

        .dropzone {
            width: 100px;
            height: 100px;
            border: 2px dashed #999;
            position: relative;
        }

        .piece-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-width: 350px;
        }

        .piece {
            width: 100px;
            height: 100px;
            background-size: 300px 300px;
            border: 1px solid #ccc;
            cursor: grab;
            touch-action: none;
            position: relative;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .button {
            background: #ff85a2;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .button:hover {
            background: #ff5c8a;
        }
        @media (max-width: 400px) {
    .puzzle-board {
        grid-template-columns: repeat(3, 80px);
        grid-template-rows: repeat(3, 80px);
    }

    .dropzone, .piece {
        width: 80px;
        height: 80px;
    }
}
    </style>
</head>
<body>

    <h2>🧩 เกมต่อจิ๊กซอว์ 🧩</h2>
    <div class="game-container">
        <div class="puzzle-board">
            <!-- จุดที่ต้องลากชิ้นส่วนมาวาง -->
            <div class="dropzone" data-id="1"></div>
            <div class="dropzone" data-id="2"></div>
            <div class="dropzone" data-id="3"></div>
            <div class="dropzone" data-id="4"></div>
            <div class="dropzone" data-id="5"></div>
            <div class="dropzone" data-id="6"></div>
            <div class="dropzone" data-id="7"></div>
            <div class="dropzone" data-id="8"></div>
            <div class="dropzone" data-id="9"></div>
        </div>

        <!-- กองชิ้นส่วน (อยู่ด้านล่าง) -->
        <div class="piece-container">
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: -200px -200px;" draggable="true" data-id="9"></div>
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: -100px 0;" draggable="true" data-id="2"></div>
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: 0 0;" draggable="true" data-id="1"></div>
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: -200px 0;" draggable="true" data-id="3"></div>
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: -100px -100px;" draggable="true" data-id="5"></div>
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: 0 -100px;" draggable="true" data-id="4"></div>
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: -200px -100px;" draggable="true" data-id="6"></div>
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: -100px -200px;" draggable="true" data-id="8"></div>
            <div class="piece" style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_a1nFMjHcLtrcr2igY-Fv32W2SP1d8gPx0A&s'); background-position: 0 -200px;" draggable="true" data-id="7"></div>
        </div>

        <button class="button" onclick="goToMenu()">Back to menu</button>
    </div>

    <script>
let pieces = document.querySelectorAll('.piece');
let dropzones = document.querySelectorAll('.dropzone');
let draggedPiece = null;

pieces.forEach(piece => {
    piece.addEventListener('dragstart', dragStart);
    piece.addEventListener('touchstart', touchStart, { passive: false });
    piece.addEventListener('touchmove', touchMove, { passive: false });
    piece.addEventListener('touchend', touchEnd);
});

dropzones.forEach(dropzone => {
    dropzone.addEventListener('dragover', dragOver);
    dropzone.addEventListener('drop', dropPiece);
    dropzone.addEventListener('touchend', touchDrop);
});

function dragStart(event) {
    draggedPiece = event.target;
    event.dataTransfer.setData("text", draggedPiece.dataset.id);
}

function touchStart(event) {
    draggedPiece = event.target;
    event.preventDefault(); // ป้องกันการ Scroll หน้าเว็บขณะลาก
}

function touchMove(event) {
    if (!draggedPiece) return;

    let touch = event.touches[0];
    draggedPiece.style.position = "absolute";
    draggedPiece.style.left = touch.clientX - 50 + "px";
    draggedPiece.style.top = touch.clientY - 50 + "px";
}

function touchEnd(event) {
    let touch = event.changedTouches[0];
    let dropzone = document.elementFromPoint(touch.clientX, touch.clientY);
    
    if (dropzone && dropzone.classList.contains("dropzone")) {
        dropPiece({ target: dropzone, preventDefault: () => {} });
    } else {
        resetPiece(draggedPiece);
    }

    draggedPiece = null;
}

function touchDrop(event) {
    event.preventDefault();
    if (!draggedPiece) return;

    let pieceID = draggedPiece.dataset.id;
    let zoneID = event.target.dataset.id;

    if (pieceID === zoneID) {
        event.target.appendChild(draggedPiece);
        draggedPiece.style.position = "relative";
        draggedPiece.style.left = "0px";
        draggedPiece.style.top = "0px";
        draggedPiece.draggable = false;
    } else {
        resetPiece(draggedPiece);
        alert("❌ ตำแหน่งผิด! ลองอีกครั้ง");
    }

    checkWin();
}

function dragOver(event) {
    event.preventDefault();
}

function dropPiece(event) {
    event.preventDefault();
    let pieceID = draggedPiece.dataset.id;
    let zoneID = event.target.dataset.id;

    if (pieceID === zoneID) {
        event.target.appendChild(draggedPiece);
        draggedPiece.style.position = "relative";
        draggedPiece.style.left = "0px";
        draggedPiece.style.top = "0px";
        draggedPiece.draggable = false;
    } else {
        resetPiece(draggedPiece);
        alert("❌ ตำแหน่งผิด! ลองอีกครั้ง");
    }

    checkWin();
}

function resetPiece(piece) {
    piece.style.position = "relative";
    piece.style.left = "0px";
    piece.style.top = "0px";
}

function checkWin() {
    if ([...dropzones].every(zone => zone.firstChild && zone.dataset.id === zone.firstChild.dataset.id)) {
        alert("🎉 คุณต่อจิ๊กซอว์สำเร็จ! 🎉");
    }
}

function goToMenu() {
    window.location.href = "menu.html";
}
    </script>

</body>
</html>
